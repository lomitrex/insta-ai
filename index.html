 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple RFP Tracker</title>
    <style>
        /* --- General Styles & Theme --- */
        :root {
            --primary-color: #007bff;
            --secondary-color: #6c757d;
            --success-color: #28a745;
            --danger-color: #dc3545;
            --warning-color: #fd7e14;
            --info-color: #17a2b8;
            --light-color: #f8f9fa;
            --dark-color: #343a40;
            --background-color: #f4f4f4;
            --text-color: #212529;
            --border-color: #dee2e6;
            --card-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.6;
            background-color: var(--background-color);
            color: var(--text-color);
        }

        /* --- Layout --- */
        .app-header {
            background-color: var(--dark-color);
            color: var(--light-color);
            padding: 1rem;
            text-align: center;
            margin-bottom: 2rem;
        }

        .main-container {
            display: flex;
            flex-wrap: wrap;
            gap: 2rem;
            padding: 0 2rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .form-container {
            flex: 1;
            min-width: 320px;
            background: #fff;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: var(--card-shadow);
            align-self: flex-start;
        }

        .rfp-list-container {
            flex: 2;
            min-width: 320px;
        }

        /* Responsive stacking */
        @media (max-width: 992px) {
            .main-container {
                flex-direction: column;
            }
        }

        /* --- Form Elements --- */
        .rfp-form h2, .rfp-list-container h2 {
            margin-bottom: 1.5rem;
            color: var(--dark-color);
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 0.5rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
        }

        .form-group input[type="text"],
        .form-group input[type="date"],
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 1rem;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }
        
        .form-group input:focus, 
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(0, 123, 255, 0.25);
        }

        .form-buttons {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }
        
        .btn:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }
        .btn-primary:hover {
            background-color: #0069d9;
        }

        .btn-secondary {
            background-color: var(--secondary-color);
            color: white;
        }
        .btn-secondary:hover {
            background-color: #5a6268;
        }

        /* --- RFP List & Cards --- */
        #rfpList {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
        }

        #noRfpsMessage {
            background: #fff;
            padding: 2rem;
            text-align: center;
            border-radius: 8px;
            color: var(--secondary-color);
            box-shadow: var(--card-shadow);
        }

        .rfp-card {
            background: #fff;
            border: 1px solid var(--border-color);
            border-left: 5px solid var(--primary-color);
            border-radius: 8px;
            padding: 1.5rem;
            box-shadow: var(--card-shadow);
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        
        .rfp-card h3 {
            color: var(--dark-color);
        }
        
        .rfp-card p {
            margin-bottom: 0.5rem;
        }
        
        .rfp-card .description {
             background-color: var(--light-color);
             padding: 1rem;
             border-radius: 4px;
             white-space: pre-wrap; /* Preserve line breaks */
             word-break: break-word;
        }

        .card-actions {
            margin-top: auto; /* Pushes buttons to the bottom */
            padding-top: 1rem;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: flex-end;
            gap: 0.5rem;
        }

        .card-actions .btn {
            font-size: 0.9rem;
            padding: 0.5rem 1rem;
        }
        
        .btn-edit {
            background-color: var(--success-color);
            color: white;
        }
        .btn-edit:hover {
            background-color: #218838;
        }
        
        .btn-delete {
            background-color: var(--danger-color);
            color: white;
        }
        .btn-delete:hover {
            background-color: #c82333;
        }


        /* Status Badges */
        .status-badge {
            display: inline-block;
            padding: 0.25em 0.6em;
            font-size: 0.85em;
            font-weight: 700;
            line-height: 1;
            text-align: center;
            white-space: nowrap;
            vertical-align: baseline;
            border-radius: 0.25rem;
            color: #fff;
        }

        .status-draft { background-color: var(--secondary-color); }
        .status-sent { background-color: var(--primary-color); }
        .status-under-review { background-color: var(--warning-color); }
        .status-awarded { background-color: var(--success-color); }
        .status-closed { background-color: var(--danger-color); }

    </style>
</head>
<body>

    <header class="app-header">
        <h1>Simple RFP Tracker</h1>
    </header>

    <main class="main-container">
        <div class="form-container">
            <form id="rfpForm" class="rfp-form">
                <h2>Manage RFP</h2>
                <input type="hidden" id="rfpId">

                <div class="form-group">
                    <label for="rfpTitle">RFP Title</label>
                    <input type="text" id="rfpTitle" placeholder="e.g., Website Redesign Project" required>
                </div>

                <div class="form-group">
                    <label for="projectDescription">Project Description</label>
                    <textarea id="projectDescription" placeholder="Describe the project scope and requirements..." required></textarea>
                </div>

                <div class="form-group">
                    <label for="dueDate">Due Date</label>
                    <input type="date" id="dueDate" required>
                </div>

                <div class="form-group">
                    <label for="status">Status</label>
                    <select id="status">
                        <option value="Draft">Draft</option>
                        <option value="Sent">Sent</option>
                        <option value="Under Review">Under Review</option>
                        <option value="Awarded">Awarded</option>
                        <option value="Closed">Closed</option>
                    </select>
                </div>

                <div class="form-buttons">
                    <button type="submit" id="saveBtn" class="btn btn-primary">Save RFP</button>
                    <button type="button" id="clearBtn" class="btn btn-secondary">Clear</button>
                </div>
            </form>
        </div>

        <div class="rfp-list-container">
            <h2>Current RFPs</h2>
            <div id="rfpList">
                <!-- RFP cards will be dynamically inserted here -->
            </div>
            <p id="noRfpsMessage" style="display: none;">No RFPs found. Add one using the form.</p>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {

            // --- STATE MANAGEMENT ---
            let rfps = [];
            let editMode = false;
            let currentRfpId = null;

            // --- DOM ELEMENT REFERENCES ---
            const rfpForm = document.getElementById('rfpForm');
            const rfpIdInput = document.getElementById('rfpId');
            const rfpTitleInput = document.getElementById('rfpTitle');
            const projectDescriptionInput = document.getElementById('projectDescription');
            const dueDateInput = document.getElementById('dueDate');
            const statusInput = document.getElementById('status');
            const saveBtn = document.getElementById('saveBtn');
            const clearBtn = document.getElementById('clearBtn');
            const rfpList = document.getElementById('rfpList');
            const noRfpsMessage = document.getElementById('noRfpsMessage');

            // --- FUNCTIONS ---

            /**
             * Loads RFPs from localStorage and renders them.
             */
            const loadRFPs = () => {
                const rfpsFromStorage = localStorage.getItem('rfps');
                if (rfpsFromStorage) {
                    rfps = JSON.parse(rfpsFromStorage);
                }
                renderRFPs();
            };

            /**
             * Saves the current RFPs array to localStorage.
             */
            const saveRFPsToStorage = () => {
                localStorage.setItem('rfps', JSON.stringify(rfps));
            };

            /**
             * Renders all RFPs to the DOM.
             */
            const renderRFPs = () => {
                // Clear the current list
                rfpList.innerHTML = '';

                // Show or hide the "no RFPs" message
                if (rfps.length === 0) {
                    noRfpsMessage.style.display = 'block';
                } else {
                    noRfpsMessage.style.display = 'none';
                    // Sort RFPs by due date (most recent first)
                    const sortedRfps = [...rfps].sort((a, b) => new Date(b.dueDate) - new Date(a.dueDate));
                    sortedRfps.forEach(rfp => {
                        const card = createRfpCard(rfp);
                        rfpList.appendChild(card);
                    });
                }
            };
            
            /**
             * Creates an HTML element for a single RFP card.
             * @param {object} rfp - The RFP data object.
             * @returns {HTMLElement} The card element.
             */
            const createRfpCard = (rfp) => {
                const card = document.createElement('div');
                card.className = 'rfp-card';
                card.dataset.id = rfp.id;

                const statusClass = `status-${rfp.status.toLowerCase().replace(' ', '-')}`;
                card.style.borderLeftColor = getStatusColor(rfp.status);
                
                card.innerHTML = `
                    <h3>${escapeHTML(rfp.title)}</h3>
                    <p><strong>Due Date:</strong> ${rfp.dueDate}</p>
                    <p><strong>Status:</strong> <span class="status-badge ${statusClass}">${escapeHTML(rfp.status)}</span></p>
                    <p class="description">${escapeHTML(rfp.description)}</p>
                    <div class="card-actions">
                        <button class="btn btn-edit">Edit</button>
                        <button class="btn btn-delete">Delete</button>
                    </div>
                `;
                return card;
            };
            
            /**
             * Gets the color for the status for border styling.
             * @param {string} status - The status string.
             * @returns {string} The hex color code.
             */
            const getStatusColor = (status) => {
                switch(status) {
                    case 'Draft': return 'var(--secondary-color)';
                    case 'Sent': return 'var(--primary-color)';
                    case 'Under Review': return 'var(--warning-color)';
                    case 'Awarded': return 'var(--success-color)';
                    case 'Closed': return 'var(--danger-color)';
                    default: return 'var(--secondary-color)';
                }
            };

            /**
             * Handles the form submission for both adding and updating RFPs.
             * @param {Event} e - The form submission event.
             */
            const handleFormSubmit = (e) => {
                e.preventDefault();

                // Simple validation
                if (!rfpTitleInput.value || !projectDescriptionInput.value || !dueDateInput.value) {
                    alert('Please fill in all required fields.');
                    return;
                }

                const rfpData = {
                    title: rfpTitleInput.value,
                    description: projectDescriptionInput.value,
                    dueDate: dueDateInput.value,
                    status: statusInput.value,
                };

                if (editMode && currentRfpId) {
                    // Update existing RFP
                    const rfpIndex = rfps.findIndex(r => r.id === currentRfpId);
                    if (rfpIndex > -1) {
                        rfps[rfpIndex] = { ...rfps[rfpIndex], ...rfpData };
                    }
                } else {
                    // Add new RFP
                    rfpData.id = Date.now(); // Simple unique ID
                    rfps.push(rfpData);
                }

                saveRFPsToStorage();
                renderRFPs();
                resetForm();
            };

            /**
             * Populates the form with data from an existing RFP for editing.
             * @param {number} id - The ID of the RFP to edit.
             */
            const populateFormForEdit = (id) => {
                const rfpToEdit = rfps.find(r => r.id === id);
                if (!rfpToEdit) return;

                editMode = true;
                currentRfpId = id;

                rfpIdInput.value = rfpToEdit.id;
                rfpTitleInput.value = rfpToEdit.title;
                projectDescriptionInput.value = rfpToEdit.description;
                dueDateInput.value = rfpToEdit.dueDate;
                statusInput.value = rfpToEdit.status;

                saveBtn.textContent = 'Update RFP';
                rfpForm.scrollIntoView({ behavior: 'smooth' });
            };

            /**
             * Deletes an RFP after confirmation.
             * @param {number} id - The ID of the RFP to delete.
             */
            const handleDelete = (id) => {
                if (window.confirm('Are you sure you want to delete this RFP? This action cannot be undone.')) {
                    rfps = rfps.filter(r => r.id !== id);
                    saveRFPsToStorage();
                    renderRFPs();
                    // If the deleted RFP was being edited, reset the form
                    if (currentRfpId === id) {
                        resetForm();
                    }
                }
            };

            /**
             * Resets the form to its initial state for adding a new RFP.
             */
            const resetForm = () => {
                rfpForm.reset();
                editMode = false;
                currentRfpId = null;
                rfpIdInput.value = '';
                saveBtn.textContent = 'Save RFP';
            };

            /**
             * Handles clicks within the RFP list using event delegation.
             * @param {Event} e - The click event.
             */
            const handleListClick = (e) => {
                const card = e.target.closest('.rfp-card');
                if (!card) return;

                const id = Number(card.dataset.id);

                if (e.target.classList.contains('edit-btn')) {
                    populateFormForEdit(id);
                } else if (e.target.classList.contains('delete-btn')) {
                    handleDelete(id);
                }
            };
            
            /**
            * A simple utility to escape HTML to prevent XSS.
            * @param {string} str The string to escape.
            * @returns {string} The escaped string.
            */
            const escapeHTML = (str) => {
                const p = document.createElement("p");
                p.appendChild(document.createTextNode(str));
                return p.innerHTML;
            };

            // --- EVENT LISTENERS ---
            rfpForm.addEventListener('submit', handleFormSubmit);
            clearBtn.addEventListener('click', resetForm);
            rfpList.addEventListener('click', handleListClick);

            // --- INITIALIZATION ---
            loadRFPs();
        });
    </script>

</body>
</html>
