 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Directory</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styles to prevent layout shifts when views are hidden */
        .view {
            display: none;
        }
        .view.active {
            display: block;
        }
    </style>
</head>
<body class="bg-gray-100 font-sans">

    <div id="app" class="min-h-screen flex flex-col">

        <!-- Main Content Area -->
        <main class="flex-grow container mx-auto p-4 sm:p-6 lg:p-8">

            <!-- Login View -->
            <div id="loginView" class="view active">
                <div class="max-w-md mx-auto bg-white rounded-lg shadow-md p-8 mt-10">
                    <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">Team Directory Login</h2>
                    <form id="loginForm">
                        <div class="mb-4">
                            <label for="loginEmail" class="block text-gray-700 text-sm font-bold mb-2">Email Address</label>
                            <input type="email" id="loginEmail" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" required>
                        </div>
                        <div class="mb-6">
                            <label for="loginPassword" class="block text-gray-700 text-sm font-bold mb-2">Password</label>
                            <input type="password" id="loginPassword" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 mb-3 leading-tight focus:outline-none focus:shadow-outline" required>
                        </div>
                        <div id="loginError" class="text-red-500 text-sm mb-4 text-center"></div>
                        <div class="flex items-center justify-between">
                            <button type="submit" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline w-full">
                                Login
                            </button>
                        </div>
                    </form>
                    <div class="text-center mt-6">
                        <a href="#" id="showRegisterLink" class="inline-block align-baseline font-bold text-sm text-blue-500 hover:text-blue-800">
                            Create an Account
                        </a>
                        <span class="mx-2 text-gray-400">|</span>
                        <a href="#" id="showForgotPasswordLink" class="inline-block align-baseline font-bold text-sm text-blue-500 hover:text-blue-800">
                            Forgot Password?
                        </a>
                    </div>
                </div>
            </div>

            <!-- Registration View -->
            <div id="registerView" class="view">
                <div class="max-w-lg mx-auto bg-white rounded-lg shadow-md p-8 mt-10">
                    <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">Create New Account</h2>
                    <form id="registerForm">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div class="mb-4">
                                <label for="regFullName" class="block text-gray-700 text-sm font-bold mb-2">Full Name</label>
                                <input type="text" id="regFullName" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700" required>
                            </div>
                            <div class="mb-4">
                                <label for="regEmail" class="block text-gray-700 text-sm font-bold mb-2">Email Address</label>
                                <input type="email" id="regEmail" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700" required>
                            </div>
                            <div class="mb-4">
                                <label for="regPassword" class="block text-gray-700 text-sm font-bold mb-2">Password</label>
                                <input type="password" id="regPassword" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700" required>
                            </div>
                            <div class="mb-4">
                                <label for="regDesignation" class="block text-gray-700 text-sm font-bold mb-2">Designation / Job Title</label>
                                <input type="text" id="regDesignation" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700" required>
                            </div>
                            <div class="mb-4 md:col-span-2">
                                <label for="regAddress" class="block text-gray-700 text-sm font-bold mb-2">Address</label>
                                <input type="text" id="regAddress" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700" required>
                            </div>
                            <div class="mb-4 md:col-span-2">
                                <label for="regContact" class="block text-gray-700 text-sm font-bold mb-2">Contact Info (Phone)</label>
                                <input type="tel" id="regContact" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700" required>
                            </div>
                        </div>
                        <div id="registerMessage" class="text-sm mb-4 text-center"></div>
                        <div class="mt-6">
                            <button type="submit" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline w-full">
                                Register
                            </button>
                        </div>
                    </form>
                    <div class="text-center mt-6">
                        <a href="#" id="backToLoginFromRegister" class="inline-block align-baseline font-bold text-sm text-blue-500 hover:text-blue-800">
                            Back to Login
                        </a>
                    </div>
                </div>
            </div>

            <!-- Forgot Password View -->
            <div id="forgotPasswordView" class="view">
                 <div class="max-w-md mx-auto bg-white rounded-lg shadow-md p-8 mt-10">
                    <h2 class="text-2xl font-bold text-center text-gray-800 mb-4">Retrieve Password</h2>
                     <div class="bg-yellow-100 border-l-4 border-yellow-500 text-yellow-700 p-4 mb-6" role="alert">
                        <p class="font-bold">Warning</p>
                        <p>For demonstration only. Insecure.</p>
                    </div>
                    <form id="forgotPasswordForm">
                        <div class="mb-4">
                            <label for="forgotEmail" class="block text-gray-700 text-sm font-bold mb-2">Enter your Email</label>
                            <input type="email" id="forgotEmail" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" required>
                        </div>
                        <div class="flex items-center justify-between">
                            <button type="submit" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline w-full">
                                Retrieve Password
                            </button>
                        </div>
                    </form>
                    <div id="forgotPasswordResult" class="mt-6 p-4 bg-gray-100 rounded text-center"></div>
                    <div class="text-center mt-6">
                        <a href="#" id="backToLoginFromForgot" class="inline-block align-baseline font-bold text-sm text-blue-500 hover:text-blue-800">
                            Back to Login
                        </a>
                    </div>
                </div>
            </div>

            <!-- Team Directory View -->
            <div id="directoryView" class="view">
                <header class="flex flex-col sm:flex-row justify-between items-center mb-6 pb-4 border-b">
                    <h1 class="text-3xl font-bold text-gray-800 mb-4 sm:mb-0">Team Directory</h1>
                    <div>
                         <span id="welcomeMessage" class="text-gray-600 mr-4"></span>
                         <button id="logoutButton" class="bg-red-500 hover:bg-red-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline">
                            Logout
                        </button>
                    </div>
                </header>
                
                <div class="mb-6">
                    <input type="text" id="searchInput" placeholder="Search by name or designation..." class="shadow appearance-none border rounded w-full py-3 px-4 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
                </div>

                <div id="userGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                    <!-- User cards will be inserted here -->
                </div>
            </div>

        </main>

        <!-- Footer -->
        <footer class="bg-gray-800 text-white text-center p-4">
            <p class="text-sm">Notice: This is a local-only application. All data is stored exclusively in this browser.</p>
        </footer>

    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {

        // IMPORTANT: Storing passwords in plain text in localStorage is highly insecure and is done here for demonstration purposes only. In a real-world application, never do this.

        // --- DOM Element References ---
        const views = {
            login: document.getElementById('loginView'),
            register: document.getElementById('registerView'),
            forgotPassword: document.getElementById('forgotPasswordView'),
            directory: document.getElementById('directoryView'),
        };

        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const forgotPasswordForm = document.getElementById('forgotPasswordForm');

        const loginError = document.getElementById('loginError');
        const registerMessage = document.getElementById('registerMessage');
        const forgotPasswordResult = document.getElementById('forgotPasswordResult');
        
        const searchInput = document.getElementById('searchInput');
        const userGrid = document.getElementById('userGrid');
        const welcomeMessage = document.getElementById('welcomeMessage');

        const logoutButton = document.getElementById('logoutButton');
        const showRegisterLink = document.getElementById('showRegisterLink');
        const showForgotPasswordLink = document.getElementById('showForgotPasswordLink');
        const backToLoginFromRegister = document.getElementById('backToLoginFromRegister');
        const backToLoginFromForgot = document.getElementById('backToLoginFromForgot');

        const STORAGE_KEY = 'teamDirectoryUsers';

        // --- App Initialization ---
        function initializeApp() {
            if (!localStorage.getItem(STORAGE_KEY)) {
                // Pre-populate with some dummy data if storage is empty
                const dummyUsers = [
                    {
                        id: 'admin@example.com',
                        fullName: 'Alex Johnson',
                        email: 'admin@example.com',
                        password: 'password123',
                        designation: 'Lead Developer',
                        address: '123 Tech Avenue, Silicon Valley, CA',
                        contactInfo: '555-0101'
                    },
                    {
                        id: 'jane.doe@example.com',
                        fullName: 'Jane Doe',
                        email: 'jane.doe@example.com',
                        password: 'password123',
                        designation: 'UX/UI Designer',
                        address: '456 Design Drive, Creativille, NY',
                        contactInfo: '555-0102'
                    },
                    {
                        id: 'john.smith@example.com',
                        fullName: 'John Smith',
                        email: 'john.smith@example.com',
                        password: 'password123',
                        designation: 'Project Manager',
                        address: '789 Business Blvd, Corporatum, TX',
                        contactInfo: '555-0103'
                    }
                ];
                localStorage.setItem(STORAGE_KEY, JSON.stringify(dummyUsers));
            }
            showView('login');
        }

        // --- View Management ---
        function showView(viewName) {
            Object.values(views).forEach(view => view.classList.remove('active'));
            if (views[viewName]) {
                views[viewName].classList.add('active');
            }
        }
        
        // --- Data Access ---
        function getUsers() {
            return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        }

        function saveUsers(users) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(users));
        }

        // --- Core Logic ---

        // Registration
        registerForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const users = getUsers();
            
            const fullName = document.getElementById('regFullName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;
            const designation = document.getElementById('regDesignation').value.trim();
            const address = document.getElementById('regAddress').value.trim();
            const contactInfo = document.getElementById('regContact').value.trim();
            
            registerMessage.textContent = '';
            registerMessage.classList.remove('text-red-500', 'text-green-500');

            if (users.some(user => user.email === email)) {
                registerMessage.textContent = 'Email is already in use.';
                registerMessage.classList.add('text-red-500');
                return;
            }

            const newUser = { id: email, fullName, email, password, designation, address, contactInfo };
            users.push(newUser);
            saveUsers(users);

            registerMessage.textContent = 'Registration successful! Please log in.';
            registerMessage.classList.add('text-green-500');
            registerForm.reset();
            
            setTimeout(() => {
                showView('login');
                registerMessage.textContent = '';
            }, 2000);
        });

        // Login
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const users = getUsers();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            
            loginError.textContent = '';
            
            const user = users.find(u => u.email === email && u.password === password);

            if (user) {
                welcomeMessage.textContent = `Welcome, ${user.fullName.split(' ')[0]}!`;
                renderDirectory(getUsers());
                showView('directory');
                loginForm.reset();
            } else {
                loginError.textContent = 'Invalid email or password.';
            }
        });

        // Logout
        logoutButton.addEventListener('click', () => {
            showView('login');
        });

        // Forgot Password
        forgotPasswordForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const users = getUsers();
            const email = document.getElementById('forgotEmail').value;
            const user = users.find(u => u.email === email);

            if (user) {
                forgotPasswordResult.innerHTML = `Password for <strong>${user.email}</strong> is: <br><strong class="text-blue-600 text-lg">${user.password}</strong>`;
            } else {
                forgotPasswordResult.textContent = 'User with this email not found.';
            }
        });

        // Directory Rendering & Search
        function renderDirectory(userList) {
            userGrid.innerHTML = '';
            if (userList.length === 0) {
                userGrid.innerHTML = '<p class="text-gray-500 col-span-full text-center">No users found.</p>';
                return;
            }
            userList.forEach(user => {
                const card = document.createElement('div');
                card.className = 'bg-white p-6 rounded-lg shadow-md flex flex-col';
                card.innerHTML = `
                    <h3 class="text-xl font-bold text-gray-900 mb-2">${user.fullName}</h3>
                    <p class="text-blue-600 font-semibold mb-4">${user.designation}</p>
                    <div class="text-sm text-gray-600 space-y-2 mt-auto">
                        <p><strong class="font-medium">Address:</strong> ${user.address}</p>
                        <p><strong class="font-medium">Contact:</strong> ${user.contactInfo}</p>
                    </div>
                `;
                userGrid.appendChild(card);
            });
        }
        
        searchInput.addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            const allUsers = getUsers();
            const filteredUsers = allUsers.filter(user => 
                user.fullName.toLowerCase().includes(searchTerm) ||
                user.designation.toLowerCase().includes(searchTerm)
            );
            renderDirectory(filteredUsers);
        });

        // --- Navigation Event Listeners ---
        showRegisterLink.addEventListener('click', (e) => { e.preventDefault(); showView('register'); });
        showForgotPasswordLink.addEventListener('click', (e) => { e.preventDefault(); forgotPasswordResult.textContent = ''; showView('forgotPassword'); });
        backToLoginFromRegister.addEventListener('click', (e) => { e.preventDefault(); showView('login'); });
        backToLoginFromForgot.addEventListener('click', (e) => { e.preventDefault(); showView('login'); });

        // --- Start the App ---
        initializeApp();
    });
    </script>
</body>
</html>
